name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/sbx.exe dist/ServiceBusExplorerAdvance.exe
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "ServiceBusExplorerAdvance-${{ github.ref_name }}-windows-x64.zip"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "ServiceBusExplorerAdvance-${{ github.ref_name }}-windows-x64.zip" --title "Service Bus Explorer Advance ${{ github.ref_name }}" --generate-notes
