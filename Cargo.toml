[package]
name = "sbx"
version = "1.0.0"
edition = "2024"
description = "Service Bus Studio — a fast, modern Azure Service Bus explorer"
authors = ["Harshit Mahendra"]

[profile.release]
strip = true
lto = "thin"

[dependencies]
anyhow = "1.0.104"
azservicebus = "0.25.1"
base64 = "0.23.1"
eframe = { version = "0.36.1", features = ["glow"] }
egui = "0.36.1"
egui_extras = "0.36"
fe2o3-amqp-types = "0.14"
hmac = "0.12"
reqwest = "0.13.4"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tokio = { version = "1.53.1", features = ["full"] }
urlencoding = "2.1.3"

[build-dependencies]
winresource = "0.1.31"
